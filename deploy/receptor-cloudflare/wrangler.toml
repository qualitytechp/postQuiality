name = "receptor-soporte"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# La base. Créela con:
#   npx wrangler d1 create soporte
# y pegue aquí el database_id que le devuelve.
[[d1_databases]]
binding = "DB"
database_name = "soporte"
database_id = "PEGUE_AQUI_EL_ID"

# Los nonce vividos, para que una petición firmada no se pueda reenviar.
# Se crea con:
#   npx wrangler kv namespace create NONCES
[[kv_namespaces]]
binding = "NONCES"
id = "PEGUE_AQUI_EL_ID"

# Resumen diario a las 13:00 UTC (8:00 en Colombia).
[triggers]
crons = ["0 13 * * *"]

# El token de Telegram NO va aquí: es un secreto. Se cargan así, una vez:
#   npx wrangler secret put TELEGRAM_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
